<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modulith Roastery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="i18n.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="intro">
    <div class="intro-top">
      <h1 data-i18n="title">Modulith Roastery</h1>
      <div class="language" role="group" data-i18n-aria="language">
        <button type="button" data-language="de" lang="de">Deutsch</button>
        <button type="button" data-language="en" lang="en">English</button>
      </div>
    </div>
    <p data-i18n-html="intro"></p>
  </header>

  <section class="board" aria-labelledby="board-title">
    <h2 id="board-title" class="visually-hidden" data-i18n="boardTitle"></h2>
    <div id="board" class="board-canvas" role="img" data-i18n-aria="boardAria"></div>
    <ul class="legend" data-i18n-aria="legendAria">
      <li><span class="lamp-key wait"></span><span data-i18n="legendWait"></span></li>
      <li><span class="lamp-key ok"></span><span data-i18n="legendOk"></span></li>
      <li><span class="lamp-key fail"></span><span data-i18n="legendFail"></span></li>
    </ul>
  </section>

  <main class="desk">
    <section class="counter" aria-labelledby="counter-title">
      <h2 id="counter-title" data-i18n="counterTitle"></h2>

      <form id="order-form" novalidate>
        <div id="products" class="product-list" role="group" data-i18n-aria="products"></div>
        <p id="summary" class="summary" aria-live="polite"></p>
        <button type="submit" class="primary" id="submit" data-i18n="submit"></button>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </form>

      <p class="hint" data-i18n-html="hint"></p>
    </section>

    <section class="log" aria-labelledby="log-title">
      <h2 id="log-title" data-i18n="logTitle"></h2>
      <p class="log-intro" data-i18n-html="logIntro"></p>

      <div id="failures" class="failures" hidden>
        <p id="failures-text"></p>
        <button type="button" id="resubmit" class="secondary" data-i18n="resubmit"></button>
      </div>

      <ol id="entries" class="entries" aria-live="polite"></ol>
      <p id="empty" class="empty" data-i18n="empty"></p>
    </section>
  </main>
</body>
</html>
